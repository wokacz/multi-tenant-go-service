components:
  schemas:
    AddMemberRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/AddMemberRequest.json
          format: uri
          readOnly: true
          type: string
        email:
          description: Address to invite. An existing account is not required.
          format: email
          maxLength: 255
          type: string
        role_ids:
          description: Roles to grant. Every one must be a role the caller could grant themselves.
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - email
        - role_ids
      type: object
    AppointOwnerRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/AppointOwnerRequest.json
          format: uri
          readOnly: true
          type: string
        user_id:
          description: Account to make owner
          format: uuid
          type: string
      required:
        - user_id
      type: object
    AuditEventResponse:
      additionalProperties: false
      properties:
        action:
          description: What changed, e.g. member.roles_changed
          type: string
        actor:
          $ref: "#/components/schemas/AuditParty"
          description: Who made the change
        at:
          description: When the change was made
          format: date-time
          type: string
        detail:
          type: string
        id:
          format: uuid
          type: string
        ip:
          type: string
        organization_id:
          format: uuid
          type: string
        role_id:
          format: uuid
          type: string
        role_key:
          description: Captured when the change was made, so it survives the role being deleted
          type: string
        subject:
          $ref: "#/components/schemas/AuditParty"
          description: Who it was about, absent for changes that are not about a person
        user_agent:
          type: string
      required:
        - id
        - at
        - action
        - actor
      type: object
    AuditParty:
      additionalProperties: false
      properties:
        email:
          format: email
          type: string
        id:
          format: uuid
          type: string
        name:
          type: string
      required:
        - id
      type: object
    BeginEmailChangeRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/BeginEmailChangeRequest.json
          format: uri
          readOnly: true
          type: string
        new_email:
          description: Address to move the account to
          format: email
          maxLength: 255
          minLength: 3
          type: string
        password:
          description: Current password
          maxLength: 72
          minLength: 1
          type: string
      required:
        - new_email
        - password
      type: object
    ChangePasswordRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/ChangePasswordRequest.json
          format: uri
          readOnly: true
          type: string
        current_password:
          description: Current password
          maxLength: 72
          minLength: 1
          type: string
        password:
          description: New password
          maxLength: 72
          minLength: 12
          type: string
        password_confirm:
          description: New password again
          maxLength: 72
          minLength: 12
          type: string
      required:
        - current_password
        - password
        - password_confirm
      type: object
    ConfirmEmailChangeRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/ConfirmEmailChangeRequest.json
          format: uri
          readOnly: true
          type: string
        code:
          description: Code from the message sent to the new address
          maxLength: 12
          minLength: 1
          type: string
      required:
        - code
      type: object
    ConfirmPasswordResetRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/ConfirmPasswordResetRequest.json
          format: uri
          readOnly: true
          type: string
        code:
          description: The code delivered after requesting a reset
          maxLength: 6
          minLength: 6
          type: string
        email:
          description: Email address
          format: email
          maxLength: 255
          type: string
        password:
          description: New password
          maxLength: 72
          minLength: 12
          type: string
        password_confirm:
          description: Must match password
          maxLength: 72
          minLength: 12
          type: string
      required:
        - email
        - code
        - password
        - password_confirm
      type: object
    CreatePlatformOrganizationRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/CreatePlatformOrganizationRequest.json
          format: uri
          readOnly: true
          type: string
        name:
          description: Display name
          maxLength: 100
          minLength: 1
          type: string
        slug:
          description: Lowercase handle, unique in the installation
          maxLength: 63
          minLength: 1
          type: string
      required:
        - slug
        - name
      type: object
    CreateRoleRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/CreateRoleRequest.json
          format: uri
          readOnly: true
          type: string
        description:
          maxLength: 255
          type: string
        key:
          description: Lowercase identifier, unique in the organization
          maxLength: 64
          minLength: 1
          type: string
        name:
          description: Display name
          maxLength: 100
          minLength: 1
          type: string
        permissions:
          description: Permission keys. Every one must be a permission the caller holds.
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - key
        - name
        - permissions
      type: object
    CreateSessionRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/CreateSessionRequest.json
          format: uri
          readOnly: true
          type: string
        email:
          description: Email address
          format: email
          maxLength: 255
          type: string
        password:
          description: Plain-text password
          maxLength: 72
          minLength: 1
          type: string
      required:
        - email
        - password
      type: object
    CreateUserRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/CreateUserRequest.json
          format: uri
          readOnly: true
          type: string
        email:
          description: Email address
          format: email
          maxLength: 255
          type: string
        name:
          description: Display name
          maxLength: 100
          minLength: 1
          type: string
        password:
          description: Plain-text password, hashed before storage
          maxLength: 72
          minLength: 12
          type: string
        password_confirm:
          description: Must match password
          maxLength: 72
          minLength: 12
          type: string
      required:
        - name
        - email
        - password
        - password_confirm
      type: object
    DeviceResponse:
      additionalProperties: false
      properties:
        created_at:
          description: When it was first seen
          format: date-time
          type: string
        current:
          description: Whether this is the device making the request
          type: boolean
        id:
          description: Unique identifier
          format: uuid
          type: string
        label:
          description: Name the owner gave this device
          type: string
        last_ip:
          description: Address last seen using it
          type: string
        last_seen_at:
          description: When it was last used, absent if never
          format: date-time
          type: string
        revoked:
          description: Whether it is blocked from signing in
          type: boolean
        trusted:
          description: Whether it may skip the second factor
          type: boolean
        user_agent:
          description: User agent last seen using it
          type: string
      required:
        - id
        - trusted
        - revoked
        - current
        - created_at
      type: object
    Document:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/Document.json
          format: uri
          readOnly: true
          type: string
        code:
          description: Stable machine-readable identifier for this refusal
          type: string
        detail:
          description: Human-readable explanation, in the negotiated language. Never parse this — use code.
          type: string
        errors:
          description: Field-level problems, when the request failed validation
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI identifying this occurrence
          format: uri
          type: string
        required_permission:
          description: Permission key the caller was missing
          type: string
        status:
          description: HTTP status code
          format: int64
          type: integer
        title:
          description: Short, human-readable summary of the problem type
          type: string
        type:
          description: A URI identifying the problem type
          format: uri
          type: string
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    GrantSystemRoleRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/GrantSystemRoleRequest.json
          format: uri
          readOnly: true
          type: string
        role_key:
          description: Installation-wide role key
          maxLength: 64
          minLength: 1
          type: string
        user_id:
          description: Account to grant it to
          format: uuid
          type: string
      required:
        - user_id
        - role_key
      type: object
    HealthOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/HealthOutputBody.json
          format: uri
          readOnly: true
          type: string
        status:
          description: Overall health of the service
          examples:
            - ok
          type: string
      required:
        - status
      type: object
    InvitationResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/InvitationResponse.json
          format: uri
          readOnly: true
          type: string
        email:
          description: Address the invitation was issued to
          format: email
          type: string
        expires_at:
          description: After this it can no longer be accepted
          format: date-time
          type: string
        organization:
          $ref: "#/components/schemas/OrganizationResponse"
        roles:
          description: Role keys it will grant once accepted
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - organization
        - email
        - roles
        - expires_at
      type: object
    InvitationTokenRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/InvitationTokenRequest.json
          format: uri
          readOnly: true
          type: string
        token:
          description: Token from the invitation message
          maxLength: 128
          minLength: 16
          type: string
      required:
        - token
      type: object
    InviteMembersOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/InviteMembersOutputBody.json
          format: uri
          readOnly: true
          type: string
        results:
          items:
            $ref: "#/components/schemas/InviteResultResponse"
          type:
            - array
            - "null"
      required:
        - results
      type: object
    InviteMembersRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/InviteMembersRequest.json
          format: uri
          readOnly: true
          type: string
        emails:
          description: Addresses to invite. An existing account is not required.
          items:
            format: email
            type: string
          maxItems: 50
          minItems: 1
          type:
            - array
            - "null"
          uniqueItems: true
        role_ids:
          description: Roles to grant every one of them. Each must be a role the caller could grant themselves.
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - emails
        - role_ids
      type: object
    InviteResultResponse:
      additionalProperties: false
      properties:
        email:
          description: The address, normalised
          format: email
          type: string
        status:
          description: What happened to this one
          enum:
            - invited
            - already_member
          type: string
      required:
        - email
        - status
      type: object
    ListAuditOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/ListAuditOutputBody.json
          format: uri
          readOnly: true
          type: string
        events:
          items:
            $ref: "#/components/schemas/AuditEventResponse"
          type:
            - array
            - "null"
      required:
        - events
      type: object
    ListDevicesOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/ListDevicesOutputBody.json
          format: uri
          readOnly: true
          type: string
        devices:
          items:
            $ref: "#/components/schemas/DeviceResponse"
          type:
            - array
            - "null"
      required:
        - devices
      type: object
    ListInvitationsOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/ListInvitationsOutputBody.json
          format: uri
          readOnly: true
          type: string
        invitations:
          items:
            $ref: "#/components/schemas/InvitationResponse"
          type:
            - array
            - "null"
      required:
        - invitations
      type: object
    ListLoginEventsOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/ListLoginEventsOutputBody.json
          format: uri
          readOnly: true
          type: string
        events:
          items:
            $ref: "#/components/schemas/LoginEventResponse"
          type:
            - array
            - "null"
      required:
        - events
      type: object
    ListMembersOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/ListMembersOutputBody.json
          format: uri
          readOnly: true
          type: string
        members:
          items:
            $ref: "#/components/schemas/MemberResponse"
          type:
            - array
            - "null"
      required:
        - members
      type: object
    ListMyInvitationsOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/ListMyInvitationsOutputBody.json
          format: uri
          readOnly: true
          type: string
        invitations:
          items:
            $ref: "#/components/schemas/InvitationResponse"
          type:
            - array
            - "null"
      required:
        - invitations
      type: object
    ListMyOrganizationsOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/ListMyOrganizationsOutputBody.json
          format: uri
          readOnly: true
          type: string
        organizations:
          items:
            $ref: "#/components/schemas/MembershipResponse"
          type:
            - array
            - "null"
      required:
        - organizations
      type: object
    ListPermissionsOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/ListPermissionsOutputBody.json
          format: uri
          readOnly: true
          type: string
        permissions:
          items:
            $ref: "#/components/schemas/PermissionResponse"
          type:
            - array
            - "null"
      required:
        - permissions
      type: object
    ListPlatformOrganizationsOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/ListPlatformOrganizationsOutputBody.json
          format: uri
          readOnly: true
          type: string
        organizations:
          items:
            $ref: "#/components/schemas/PlatformOrganizationResponse"
          type:
            - array
            - "null"
      required:
        - organizations
      type: object
    ListPlatformUsersOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/ListPlatformUsersOutputBody.json
          format: uri
          readOnly: true
          type: string
        users:
          items:
            $ref: "#/components/schemas/PlatformUserResponse"
          type:
            - array
            - "null"
      required:
        - users
      type: object
    ListRolesOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/ListRolesOutputBody.json
          format: uri
          readOnly: true
          type: string
        roles:
          items:
            $ref: "#/components/schemas/RoleResponse"
          type:
            - array
            - "null"
      required:
        - roles
      type: object
    ListSystemRolesOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/ListSystemRolesOutputBody.json
          format: uri
          readOnly: true
          type: string
        holders:
          items:
            $ref: "#/components/schemas/SystemRoleHolderResponse"
          type:
            - array
            - "null"
      required:
        - holders
      type: object
    LoginEventResponse:
      additionalProperties: false
      properties:
        created_at:
          description: When it happened
          format: date-time
          type: string
        device_id:
          description: Device involved, absent when the attempt failed before one was identified
          format: uuid
          type: string
        id:
          description: Unique identifier
          format: uuid
          type: string
        ip:
          description: Address the attempt came from
          type: string
        outcome:
          description: How the attempt ended
          enum:
            - success
            - bad_password
            - mfa_failed
            - locked
          type: string
        user_agent:
          description: User agent that made the attempt
          type: string
      required:
        - id
        - outcome
        - ip
        - created_at
      type: object
    MemberResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/MemberResponse.json
          format: uri
          readOnly: true
          type: string
        email:
          description: Email address
          format: email
          type: string
        id:
          description: Membership id, used to address this person here
          format: uuid
          type: string
        joined_at:
          description: When the membership first became active
          format: date-time
          type: string
        name:
          description: Display name
          type: string
        roles:
          description: Roles held in this organization
          items:
            $ref: "#/components/schemas/RoleSummaryResponse"
          type:
            - array
            - "null"
        status:
          description: Whether the membership grants anything
          enum:
            - active
            - suspended
          type: string
        user_id:
          description: The account behind the membership. Always present now that an invitation is not a membership; the field stays optional so clients written against the older contract keep working.
          format: uuid
          type: string
      required:
        - id
        - email
        - status
        - roles
      type: object
    MembershipResponse:
      additionalProperties: false
      properties:
        id:
          description: Membership id, which is what DELETE /v1/me/memberships/{membershipID} takes to leave
          format: uuid
          type: string
        organization:
          $ref: "#/components/schemas/OrganizationResponse"
        roles:
          description: Keys of the roles the caller holds here
          items:
            type: string
          type:
            - array
            - "null"
        status:
          description: Where the caller stands in this organization
          enum:
            - active
            - suspended
          type: string
      required:
        - id
        - organization
        - status
        - roles
      type: object
    OrganizationResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/OrganizationResponse.json
          format: uri
          readOnly: true
          type: string
        created_at:
          description: When the organization was created
          format: date-time
          type: string
        id:
          description: Unique identifier
          format: uuid
          type: string
        name:
          description: Display name
          type: string
        slug:
          description: Stable human-readable handle
          type: string
      required:
        - id
        - slug
        - name
        - created_at
      type: object
    PermissionResponse:
      additionalProperties: false
      properties:
        group:
          description: Heading to file it under
          type: string
        key:
          description: Stable identifier used everywhere else in the API
          type: string
        scope:
          description: What the permission is measured against
          enum:
            - organization
            - system
          type: string
      required:
        - key
        - scope
        - group
      type: object
    PermissionSnapshotResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/PermissionSnapshotResponse.json
          format: uri
          readOnly: true
          type: string
        organizations:
          items:
            $ref: "#/components/schemas/SnapshotMembership"
          type:
            - array
            - "null"
        system:
          $ref: "#/components/schemas/SnapshotSystem"
        user:
          $ref: "#/components/schemas/SnapshotUser"
      required:
        - user
        - system
        - organizations
      type: object
    PlatformOrganizationResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/PlatformOrganizationResponse.json
          format: uri
          readOnly: true
          type: string
        created_at:
          description: When the organization was created
          format: date-time
          type: string
        id:
          description: Unique identifier
          format: uuid
          type: string
        is_protected:
          description: Refuses deletion. The default organization carries it.
          type: boolean
        name:
          description: Display name
          type: string
        owners:
          description: How many people can administer it, counted the same way the last-owner rule counts. Zero means nobody can, and POST /v1/platform/organizations/{id}/owners is the way back.
          format: int64
          type: integer
        slug:
          description: Stable human-readable handle
          type: string
      required:
        - is_protected
        - owners
        - id
        - slug
        - name
        - created_at
      type: object
    PlatformUserResponse:
      additionalProperties: false
      properties:
        created_at:
          type: string
        email:
          format: email
          type: string
        id:
          format: uuid
          type: string
        locale:
          type: string
        name:
          type: string
        suspended:
          description: Blocked from signing in anywhere
          type: boolean
        suspended_at:
          type: string
      required:
        - id
        - name
        - email
        - suspended
        - created_at
      type: object
    RequestPasswordResetRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/RequestPasswordResetRequest.json
          format: uri
          readOnly: true
          type: string
        email:
          description: Email address
          format: email
          maxLength: 255
          type: string
      required:
        - email
      type: object
    RoleResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/RoleResponse.json
          format: uri
          readOnly: true
          type: string
        description:
          type: string
        id:
          format: uuid
          type: string
        is_system:
          description: "Ships with the product: visible and clonable, never editable"
          type: boolean
        key:
          description: Stable identifier, and the translation key
          type: string
        members:
          description: How many people hold it
          format: int64
          type: integer
        name:
          description: Display name
          type: string
        permissions:
          description: Permission keys this role grants
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - id
        - key
        - name
        - is_system
        - permissions
        - members
      type: object
    RoleSummaryResponse:
      additionalProperties: false
      properties:
        id:
          format: uuid
          type: string
        is_system:
          description: Whether the role ships with the product and cannot be edited
          type: boolean
        key:
          description: Stable identifier, and the translation key
          type: string
        name:
          description: Display name. A shipped role is named in the caller language; a role the organization created is shown as it was typed.
          type: string
      required:
        - id
        - key
        - name
        - is_system
      type: object
    SessionResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/SessionResponse.json
          format: uri
          readOnly: true
          type: string
        device_token:
          description: Opaque secret identifying this device on later sign-ins
          type: string
        expires_at:
          description: When the token stops being accepted
          format: date-time
          type: string
        token:
          description: Bearer token for subsequent requests
          type: string
        two_factor_required:
          description: True when a code was emailed and no token was issued
          type: boolean
        user:
          $ref: "#/components/schemas/UserResponse"
      required:
        - two_factor_required
      type: object
    SetMemberRolesRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/SetMemberRolesRequest.json
          format: uri
          readOnly: true
          type: string
        role_ids:
          description: The complete set of roles this person should hold
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - role_ids
      type: object
    SetRolePermissionsRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/SetRolePermissionsRequest.json
          format: uri
          readOnly: true
          type: string
        permissions:
          description: The complete set of permission keys this role should grant
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - permissions
      type: object
    SetTwoFactorRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/SetTwoFactorRequest.json
          format: uri
          readOnly: true
          type: string
        enabled:
          description: Whether sign-in from an untrusted device should need a code
          type: boolean
        password:
          description: Current password
          maxLength: 72
          minLength: 1
          type: string
      required:
        - password
        - enabled
      type: object
    SnapshotMembership:
      additionalProperties: false
      properties:
        id:
          format: uuid
          type: string
        name:
          type: string
        permissions:
          description: Permission keys held here
          items:
            type: string
          type:
            - array
            - "null"
        roles:
          description: Role keys held here
          items:
            type: string
          type:
            - array
            - "null"
        slug:
          type: string
        status:
          enum:
            - active
            - suspended
          type: string
      required:
        - id
        - slug
        - name
        - status
        - roles
        - permissions
      type: object
    SnapshotSystem:
      additionalProperties: false
      properties:
        permissions:
          description: Installation-wide permission keys
          items:
            type: string
          type:
            - array
            - "null"
        roles:
          description: Installation-wide role keys, empty for almost everyone
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - roles
        - permissions
      type: object
    SnapshotUser:
      additionalProperties: false
      properties:
        id:
          format: uuid
          type: string
        locale:
          description: Language this response was written in
          type: string
      required:
        - id
        - locale
      type: object
    SuspendPlatformUserRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/SuspendPlatformUserRequest.json
          format: uri
          readOnly: true
          type: string
        suspended:
          description: true blocks the account everywhere, false restores it
          type: boolean
      required:
        - suspended
      type: object
    SystemRoleHolderResponse:
      additionalProperties: false
      properties:
        email:
          format: email
          type: string
        granted_at:
          format: date-time
          type: string
        granted_by:
          description: Who granted it, absent when it came from the bootstrap command
          format: uuid
          type: string
        name:
          type: string
        role_key:
          description: Installation-wide role held, e.g. platform_admin
          type: string
        user_id:
          format: uuid
          type: string
      required:
        - user_id
        - role_key
        - granted_at
      type: object
    UpdateMeRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/UpdateMeRequest.json
          format: uri
          readOnly: true
          type: string
        locale:
          description: BCP 47 tag, or empty to negotiate from Accept-Language on every request
          maxLength: 10
          type: string
        name:
          description: Display name
          maxLength: 100
          minLength: 1
          type: string
      type: object
    UpdateMemberStatusRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/UpdateMemberStatusRequest.json
          format: uri
          readOnly: true
          type: string
        status:
          description: Suspending withdraws every permission without losing the role assignments
          enum:
            - active
            - suspended
          type: string
      required:
        - status
      type: object
    UpdateOrganizationRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/UpdateOrganizationRequest.json
          format: uri
          readOnly: true
          type: string
        name:
          description: Display name
          maxLength: 100
          minLength: 1
          type: string
      required:
        - name
      type: object
    UpdateRoleRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/UpdateRoleRequest.json
          format: uri
          readOnly: true
          type: string
        description:
          maxLength: 255
          type: string
        name:
          description: Display name
          maxLength: 100
          minLength: 1
          type: string
      required:
        - name
      type: object
    UserResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/UserResponse.json
          format: uri
          readOnly: true
          type: string
        created_at:
          description: When the account was registered
          format: date-time
          type: string
        email:
          description: Email address, normalised to lower case
          format: email
          type: string
        id:
          description: Unique identifier
          format: uuid
          type: string
        locale:
          description: Preferred language, remembered from registration. Outranks Accept-Language.
          type: string
        name:
          description: Display name
          type: string
        two_factor_enabled:
          description: Whether sign-in from an untrusted device needs an emailed code
          type: boolean
      required:
        - id
        - name
        - email
        - two_factor_enabled
        - created_at
      type: object
    VerifySessionRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/VerifySessionRequest.json
          format: uri
          readOnly: true
          type: string
        code:
          description: The code delivered after signing in
          maxLength: 6
          minLength: 6
          type: string
        email:
          description: Email address
          format: email
          maxLength: 255
          type: string
      required:
        - email
        - code
      type: object
  securitySchemes:
    bearer:
      bearerFormat: JWT
      scheme: bearer
      type: http
info:
  description: Tracks users, their known devices, and login history.
  license:
    identifier: MIT
    name: MIT
  title: Example
  version: 0.1.0
openapi: 3.1.0
paths:
  /health:
    get:
      description: Reports whether the service can serve traffic. Returns 503 when a dependency it cannot work without is unreachable.
      operationId: health
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthOutputBody"
          description: OK
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Document"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Document"
          description: Service Unavailable
      summary: Health check
      tags:
        - meta
  /v1/me:
    get:
      description: Returns the account that owns the Bearer token.
      operationId: get-me
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Document"
          description: Unauthorized
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Document"
          description: Not Found
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Document"
          description: Internal Server Error
      security:
        - bearer: []
      summary: Fetch the authenticated user
      tags:
        - users
    patch:
      description: "Self-service: no permission is required, and none can take it away. Both fields are optional — an absent field is left alone, which is not the same as sending an empty one. An empty locale clears the preference and puts the account back to negotiating from Accept-Language on every request. A locale this build does not ship is refused with 422 and the code unsupported_locale. The address is changed separately, through POST /v1/me/email, because that one has to prove the mailbox is readable."
      operationId: update-me
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Document"
          description: Unauthorized
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Document"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Document"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Document"
          description: Internal Server Error
      security:
        - bearer: []
      summary: Change the caller's own name or language
      tags:
        - users
  /v1/me/devices:
    get:
      description: Returns every device that has signed in to the account, most recently seen first, including revoked ones so the owner can see what was blocked.
      operationId: list-devices
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListDevicesOutputBody"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Document"
          description: Unauthorized
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Document"
          description: Internal Server Error
      security:
        - bearer: []
      summary: List known devices
      tags:
        - devices
  /v1/me/devices/{id}:
    delete:
      description: Blocks the device and drops its trust. Tokens already issued to it stop working on the next request rather than at expiry. Revoking the device making the call is allowed, and is how a client signs itself out. Revoking twice succeeds. An id that is not the caller's is 404.
      operationId: revoke-device
      parameters:
        - description: Device id
          in: path
          name: id
          required: true
          schema:
            description: Device id
            format: uuid
            type: string
      responses:
        "204":
          description: No Content
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Document"
          description: Unauthorized
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Document"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Document"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Document"
          description: Internal Server Error
      security:
        - bearer: []
      summary: Revoke a device
      tags:
        - devices
  /v1/me/email:
    post:
      description: Sends a confirmation code to the new address. The account keeps its current address until the code comes back, so an address nobody has answered on never becomes the one that receives password resets. Requires the current password. Whether the new address is already registered is not disclosed here — that answer is given only to somebody who can read the code out of the mailbox.
      operationId: begin-email-change
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BeginEmailChangeRequest"
        required: true
      responses:
        "204":
          description: No Content
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Document"
          description: Unauthorized
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Document"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Document"
          description: Unprocessable Entity
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Document"
          description: Too Many Requests
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Document"
          description: Internal Server Error
      security:
        - bearer: []
      summary: Ask to change the account's address
      tags:
        - auth
  /v1/me/email/verify:
    post:
      description: "Applies the address the code was sent to. A wrong, expired or already-spent code, and no outstanding change at all, share one answer. Existing sessions are deliberately left alone: the password has not changed, so signing every device out would be a surprise with no security benefit. 409 means the address was claimed by somebody else while the code was in flight."
      operationId: confirm-email-change
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmEmailChangeRequest"
        required: true
      responses:
        "204":
          description: No Content
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Document"
          description: Unauthorized
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Document"
          description: Not Found
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Document"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Document"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Document"
          description: Internal Server Error
      security:
        - bearer: []
      summary: Confirm the account's new address
      tags:
        - auth
  /v1/me/invitations:
    get:
      description: What has been offered to the caller's address, without the tokens. Accepting still needs the token from the message — this is here so somebody who deleted the mail can see that an offer is open and ask for it again.
      operationId: list-my-invitations
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListMyInvitationsOutputBody"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Document"
          description: Unauthorized
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Document"
          description: Not Found
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Document"
          description: Internal Server Error
      security:
        - bearer: []
      summary: List invitations addressed to this account
      tags:
        - users
  /v1/me/invitations/accept:
    post:
      description: "Takes up an offer using the token from the message, creating an active membership with the roles the invitation carries. The roles come from the invitation, never from this request. The address it was issued to must match the caller's account: 409 says the token is good but was meant for somebody else, and 410 that it has expired."
      operationId: accept-invitation
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationTokenRequest"
        required: true
      responses:
        "204":
          description: No Content
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Document"
          description: Unauthorized
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Document"
          description: Not Found
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Document"
          description: Conflict
        "410":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Document"
          description: Gone
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Document"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Document"
          description: Internal Server Error
      security:
        - bearer: []
      summary: Accept an invitation
      tags:
        - users
  /v1/me/invitations/decline:
    post:
      description: "Removes the offer. Holding the token is the authorization: whoever can read the mailbox is entitled to refuse on its behalf."
      operationId: decline-invitation
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationTokenRequest"
        required: true
      responses:
        "204":
          description: No Content
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Document"
          description: Unauthorized
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Document"
          description: Not Found
        "410":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Document"
          description: Gone
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Document"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Document"
          description: Internal Server Error
      security:
        - bearer: []
      summary: Decline an invitation
      tags:
        - users
  /v1/me/login-events:
    get:
      description: Returns the account's recent sign-in attempts, newest first. Attempts against an address that is not registered are not recorded, so an empty history means nobody has tried this account.
      operationId: list-login-events
      parameters:
        - description: How many entries to return, newest first
          explode: false
          in: query
          name: limit
          schema:
            default: 50
            description: How many entries to return, newest first
            format: int64
            maximum: 50
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListLoginEventsOutputBody"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Document"
          description: Unauthorized
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Document"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Document"
          description: Internal Server Error
      security:
        - bearer: []
      summary: List sign-in history
      tags:
        - devices
  /v1/me/memberships/{membershipID}:
    delete:
      description: "Removes the caller's own membership. Self-service: no permission is required, and none can take it away — until this existed the only ways out were asking an administrator or calling remove-member on yourself, which needs members.remove, so the callers most likely to want out were the ones who could not. The path names the membership rather than the organization, and the id comes from GET /v1/me/organizations: an {orgID} in a path means the middleware resolved a permission there, and nothing does here. A membership that is not the caller's own is 404, and the last owner of an organization is refused with 409 — appoint another owner first."
      operationId: leave-organization
      parameters:
        - description: The caller's own membership, from GET /v1/me/organizations
          in: path
          name: membershipID
          required: true
          schema:
            description: The caller's own membership, from GET /v1/me/organizations
            format: uuid
            type: string
      responses:
        "204":
          description: No Content
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Document"
          description: Unauthorized
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Document"
          description: Not Found
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Document"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Document"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Document"
          description: Internal Server Error
      security:
        - bearer: []
      summary: Leave an organization
      tags:
        - organizations
  /v1/me/organizations:
    get:
      description: "Returns every organization the account belongs to, including the ones it is suspended in, so a client can tell those apart. Invitations are not memberships and are listed separately at GET /v1/me/invitations. Self-service: no permission is required, and none can take it away."
      operationId: list-my-organizations
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListMyOrganizationsOutputBody"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Document"
          description: Unauthorized
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Document"
          description: Internal Server Error
      security:
        - bearer: []
      summary: List the caller's organizations
      tags:
        - organizations
  /v1/me/password:
    post:
      description: "Requires the current password. Until now the only way to change a password was to forget it and go through POST /v1/password-resets, which needs access to the mailbox. Every token issued for the account stops working, this request's own included, so the client has to sign in again — the same thing a reset already did. Trusted devices are untouched: this ends sessions, and DELETE /v1/me/devices/{id} is what ends a device."
      operationId: change-password
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
        required: true
      responses:
        "204":
          description: No Content
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Document"
          description: Unauthorized
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Document"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Document"
          description: Unprocessable Entity
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Document"
          description: Too Many Requests
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Document"
          description: Internal Server Error
      security:
        - bearer: []
      summary: Change the caller's own password
      tags:
        - auth
  /v1/me/permissions:
    get:
      description: "The snapshot a client uses to decide what to render. Self-service: no permission is required and none can take it away. It is a hint, not a decision — every request is authorized again on the server, so a client holding a stale snapshot receives a 403 and should refresh. Carries an ETag; send it back as If-None-Match to get a 304."
      operationId: get-my-permissions
      parameters:
        - description: ETag from a previous response; a match answers 304
          in: header
          name: If-None-Match
          schema:
            description: ETag from a previous response; a match answers 304
            type: string
      responses:
        "200":
