  /v1/sessions:
    post:
      description: Exchanges an email and password for a Bearer token. Wrong passwords and unknown addresses share one error. When the account has two-factor on and the X-Device-Token is missing or names an untrusted device, the answer is 202 with two_factor_required and a code goes out by email; finish at POST /v1/sessions/verify.
      operationId: create-session
      parameters:
        - description: Device token from a previous sign-in, if any
          in: header
          name: X-Device-Token
          schema:
            description: Device token from a previous sign-in, if any
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
          description: Created
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Document"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Document"
          description: Forbidden
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Document"
          description: Unprocessable Entity
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Document"
          description: Too Many Requests
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Document"
          description: Internal Server Error
      summary: Sign in
      tags:
        - auth
  /v1/sessions/verify:
    post:
      description: Spends the emailed code and issues the token. The X-Device-Token must be the one returned by the sign-in that raised the challenge — a code authorises one device, not one mailbox. Succeeding also trusts that device, so later sign-ins from it skip the code. Every way of getting it wrong shares one error.
      operationId: verify-session
      parameters:
        - description: Device token the code was issued for
          in: header
          name: X-Device-Token
          required: true
          schema:
            description: Device token the code was issued for
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifySessionRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
          description: Created
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Document"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Document"
          description: Forbidden
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Document"
          description: Unprocessable Entity
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Document"
          description: Too Many Requests
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Document"
          description: Internal Server Error
      summary: Finish a two-factor sign-in
      tags:
        - auth
  /v1/users:
    post:
      description: Creates an account. password and password_confirm must match. A duplicate email is reported as success so the response cannot be used to discover registered addresses. Sign in with POST /v1/sessions to obtain a token.
      operationId: create-user
      parameters:
        - description: Language to remember for this account. Absent means no preference, and later requests keep negotiating per request.
          in: header
          name: Accept-Language
          schema:
            description: Language to remember for this account. Absent means no preference, and later requests keep negotiating per request.
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
        required: true
      responses:
        "204":
          description: No Content
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Document"
          description: Unprocessable Entity
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Document"
          description: Too Many Requests
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Document"
          description: Internal Server Error
      summary: Register a user
      tags:
        - auth
  /v1/users/{id}:
    get:
      description: Returns the authenticated user's own record. Another user's id is indistinguishable from a missing one.
      operationId: get-user
      parameters:
        - description: User id
          in: path
          name: id
          required: true
          schema:
            description: User id
            format: uuid
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Document"
          description: Unauthorized
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Document"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Document"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Document"
          description: Internal Server Error
      security:
        - bearer: []
      summary: Fetch a user
      tags:
        - users
