      operationId: create-session
      parameters:
        - description: Device token from a previous sign-in, if any
          in: header
          name: X-Device-Token
          schema:
            description: Device token from a previous sign-in, if any
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
          description: Created
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Document"
          description: Unauthorized
        "403":
          content:
