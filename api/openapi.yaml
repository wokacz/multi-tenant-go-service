    patch:
      description: Requires platform.users.suspend. Suspending takes effect on tokens already issued, on the next request rather than at expiry — the same promise device revocation makes. Memberships and roles are kept, so restoring gives back exactly what was there.
      operationId: suspend-platform-user
      parameters:
        - description: Account id
          in: path
          name: id
          required: true
          schema:
            description: Account id
            format: uuid
            type: string
