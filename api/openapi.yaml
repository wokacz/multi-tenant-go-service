components:
  schemas:
    CreateUserRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CreateUserRequest.json
          format: uri
          readOnly: true
          type: string
        email:
          description: Email address
          format: email
          maxLength: 255
          type: string
        name:
          description: Display name
          maxLength: 100
          minLength: 1
          type: string
        password:
          description: Plain-text password, hashed before storage
          maxLength: 72
          minLength: 12
          type: string
      required:
        - name
        - email
        - password
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    HealthOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/HealthOutputBody.json
          format: uri
          readOnly: true
          type: string
        database:
          description: Reachability of the database
          examples:
            - ok
          type: string
        status:
          description: Overall health of the service
          examples:
            - ok
          type: string
      required:
        - status
        - database
      type: object
    UserResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/UserResponse.json
          format: uri
          readOnly: true
          type: string
        created_at:
          description: When the account was registered
          format: date-time
          type: string
        email:
          description: Email address, normalised to lower case
          format: email
          type: string
        id:
          description: Unique identifier
          format: uuid
          type: string
        name:
          description: Display name
          type: string
      required:
        - id
        - name
        - email
        - created_at
      type: object
info:
  description: Tracks users, their known devices, and login history.
  license:
    identifier: MIT
    name: MIT
  title: Example
  version: 0.1.0
openapi: 3.1.0
paths:
  /health:
    get:
      description: Reports whether the service can serve traffic. Returns 503 when a dependency it cannot work without is unreachable.
      operationId: health
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthOutputBody"
          description: OK
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Service Unavailable
      summary: Health check
      tags:
        - meta
  /v1/users:
    post:
      operationId: create-user
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
          description: Created
          headers:
            Location:
              schema:
                type: string
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Register a user
      tags:
        - users
  /v1/users/{id}:
    get:
      operationId: get-user
      parameters:
        - description: User id
          in: path
          name: id
          required: true
          schema:
            description: User id
            format: uuid
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
          description: OK
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Fetch a user
      tags:
        - users
tags:
  - description: Service health and introspection
    name: meta
  - description: User accounts
    name: users
