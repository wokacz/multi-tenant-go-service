              schema:
                $ref: "#/components/schemas/Document"
          description: Internal Server Error
      summary: Sign in
      tags:
        - auth
  /v1/sessions/verify:
    post:
      description: Spends the emailed code and issues the token. The X-Device-Token must be the one returned by the sign-in that raised the challenge — a code authorises one device, not one mailbox. Succeeding also trusts that device, so later sign-ins from it skip the code. Every way of getting it wrong shares one error.
      operationId: verify-session
      parameters:
        - description: Device token the code was issued for
          in: header
          name: X-Device-Token
          required: true
          schema:
            description: Device token the code was issued for
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifySessionRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
          description: Created
        "401":
          content:
            application/problem+json:
