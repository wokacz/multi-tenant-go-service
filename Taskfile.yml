# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

# Nothing else reads .env — the app takes its configuration straight from the
# environment, so without this the README's "cp .env.example .env" has no effect.
dotenv: [".env"]

vars:
  BIN: bin/api
  SPEC: api/openapi.yaml
  # Assembled from the same variables the application reads, so the migrations
  # can never be applied to a different database than the one it talks to.
  #
  # The defaults mirror internal/config: an .env predating a variable would
  # otherwise interpolate to an empty string and produce a URL that fails in a
  # way that points nowhere near the cause.
  DB_URL: postgres://{{.POSTGRES_USER | default "postgres"}}:{{.POSTGRES_PASSWORD | default "postgres"}}@{{.POSTGRES_HOST | default "localhost"}}:{{.POSTGRES_PORT | default "5432"}}/{{.POSTGRES_DATABASE_NAME | default "postgres"}}?sslmode={{.POSTGRES_SSL_MODE | default "disable"}}

tasks:
  default:
    desc: List the available tasks
    cmds:
      - task --list
    silent: true

  install:
    desc: Install dependencies
    cmds:
      - task tidy
      - task web:install

  build:
    desc: Build the API binary into bin/
    cmds:
      - go build -o {{.BIN}} ./cmd/api

  run:
    desc: Run the API
    cmds:
      - go run ./cmd/api

  test:
    desc: Run the test suite
    cmds:
      - go test ./... -race

  cover:
    desc: Run the tests and open an HTML coverage report
    cmds:
      - go test ./... -coverprofile=coverage.out -covermode=atomic
      - go tool cover -func=coverage.out # render coverage report as text
      - go tool cover -html=coverage.out # render coverage report as HTML

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./...

  fmt:
    desc: Apply the formatters configured in .golangci.yml
    cmds:
      - golangci-lint fmt ./...

  tidy:
    desc: Tidy and verify go.mod
    cmds:
      - go mod tidy
      - go mod verify
      # The loader is a separate module and would otherwise drift unnoticed.
      - go mod tidy -C loader

  openapi:
    desc: Regenerate the committed OpenAPI document from the code
    cmds:
      - go run ./cmd/openapi > {{.SPEC}}

  openapi:check:
    desc: Fail if the committed OpenAPI document is out of date
    cmds:
      - task: openapi
      # The contract is code-first but reviewable: any change to a handler shows
      # up as a diff in the pull request instead of being invisible.
      - git diff --exit-code -- {{.SPEC}}

  bootstrap:
    desc: Grant the first owner (needs an account to already exist)
    cmds:
      - go run ./cmd/bootstrap {{.CLI_ARGS}}

  migrate:
    desc: Apply pending migrations
    cmds:
      - atlas migrate apply --env local --url "{{.DB_URL}}"

  migrate:diff:
    desc: Generate a migration from changes to the GORM models (NAME=... required)
    requires:
      vars: [NAME]
    cmds:
      - atlas migrate diff {{.NAME}} --env local

  migrate:status:
    desc: Show which migrations have been applied
    cmds:
      - atlas migrate status --env local --url "{{.DB_URL}}"

  # Compose. The root compose.yml is an include pointer, so these run from the
  # repository root like every other task. Extra arguments after -- go to
  # Compose: `task up -- postgres` starts only the database. With no arguments
  # this waits on `api`, not the whole project — otherwise `--wait` treats the
  # one-shot migrate container as a daemon that never became healthy.
  compose:up:
    desc: Start the development stack (Postgres, migrations, API)
    aliases: [up]
    cmds:
      - docker compose up -d --wait {{if .CLI_ARGS}}{{.CLI_ARGS}}{{else}}api{{end}}

  compose:down:
    desc: Stop the stack (data and caches stay)
    aliases: [down]
    cmds:
      - docker compose down {{.CLI_ARGS}}

  compose:reset:
    desc: Stop the stack and delete data and caches
    prompt: This deletes Postgres data and Go build caches. Continue?
    cmds:
      - docker compose down -v

  compose:stop:
    desc: Stop containers without removing them
    cmds:
      - docker compose stop {{.CLI_ARGS}}

  compose:ps:
    desc: Show compose container status
    cmds:
      - docker compose ps {{.CLI_ARGS}}

  compose:logs:
    desc: Follow compose logs (service name after --)
    interactive: true
    cmds:
      - docker compose logs -f {{.CLI_ARGS}}

  compose:migrate:
    desc: Apply pending migrations in a one-shot Atlas container
    cmds:
      - docker compose run --rm migrate

  compose:build:
    desc: Build compose images
    cmds:
      - docker compose build {{.CLI_ARGS}}

  compose:debug:
    desc: Start the API under delve (API 4001, debugger 2345)
    cmds:
      - docker compose --profile debug up -d --wait api-debug

  compose:shell:
    desc: Open a shell in the API container
    interactive: true
    cmds:
      - docker compose exec api sh

  compose:bootstrap:
    desc: Grant the first owner inside the API container
    cmds:
      - docker compose exec api go run ./cmd/bootstrap {{.CLI_ARGS}}

  check:
    desc: Everything CI should run
    cmds:
      - task: tidy
      - task: lint
      - task: test
      - task: openapi:check

  clean:
    desc: Remove build and coverage artefacts
    cmds:
      - rm -rf bin coverage.out coverage.html loader/loader

  web:install:
    desc: Install the web client dependencies
    cmds:
      - cd clients/web && npm install

  web:serve:
    desc: Serve the Swagger UI for the OpenAPI document
    cmds:
      - cd clients/web && npm run start

  web:build:
    desc: Build the Swagger UI for the OpenAPI document
    cmds:
      - cd clients/web && npm run build

  web:format:
    desc: Format the web client code
    cmds:
      - cd clients/web && npm run format