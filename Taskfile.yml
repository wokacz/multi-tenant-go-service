# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

# Nothing else reads .env — the app takes its configuration straight from the
# environment, so without this the README's "cp .env.example .env" has no effect.
dotenv: [".env"]

vars:
  BIN: bin/api
  SPEC: api/openapi.yaml
  # Assembled from the same variables the application reads, so the migrations
  # can never be applied to a different database than the one it talks to.
  #
  # The defaults mirror internal/config: an .env predating a variable would
  # otherwise interpolate to an empty string and produce a URL that fails in a
  # way that points nowhere near the cause.
  DB_URL: postgres://{{.POSTGRES_USER | default "postgres"}}:{{.POSTGRES_PASSWORD | default "postgres"}}@{{.POSTGRES_HOST | default "localhost"}}:{{.POSTGRES_PORT | default "5432"}}/{{.POSTGRES_DATABASE_NAME | default "postgres"}}?sslmode={{.POSTGRES_SSL_MODE | default "disable"}}

tasks:
  default:
    desc: List the available tasks
    cmds:
      - task --list
    silent: true

  install:
    desc: Install dependencies
    cmds:
      - task tidy
      - task web:install

  build:
    desc: Build the API binary into bin/
    cmds:
      - go build -o {{.BIN}} ./cmd/api

  run:
    desc: Run the API
    cmds:
      - go run ./cmd/api

  test:
    desc: Run the test suite
    cmds:
      - go test ./... -race

  # The store tests skip themselves without POSTGRES_TEST, so `task test` proves
  # nothing about the SQL. This runs them against a throwaway database on a port
  # of its own, which matters on a machine where something else already owns
  # 5432: pointing them at that would run migrations and truncations over
  # somebody else's data.
  test:store:
    desc: Run the store and contract tests against a throwaway Postgres
    vars:
      PORT: '{{.PORT | default "55432"}}'
      NAME: mtgs-test-pg
    cmds:
      - defer: docker rm -f {{.NAME}} >/dev/null 2>&1 || true
      - docker rm -f {{.NAME}} >/dev/null 2>&1 || true
      - docker run -d --name {{.NAME}} -e POSTGRES_PASSWORD=postgres -e POSTGRES_USER=postgres
        -e POSTGRES_DB=postgres -p 127.0.0.1:{{.PORT}}:5432 postgres:18 >/dev/null
      # Twice, with a pause. The image's entrypoint starts Postgres once to run
      # initdb and then restarts it, so a single pg_isready can succeed against the
      # temporary server and the migration that follows dies with "querying system
      # variables: EOF". Asking again after a second is what tells the two apart.
      - until docker exec {{.NAME}} pg_isready -U postgres -d postgres >/dev/null 2>&1; do sleep 1; done
      - sleep 1
      - until docker exec {{.NAME}} pg_isready -U postgres -d postgres >/dev/null 2>&1; do sleep 1; done
      - atlas migrate apply --dir "file://migrations"
        --url "postgres://postgres:postgres@localhost:{{.PORT}}/postgres?sslmode=disable"
      # CLI_ARGS so one case can be aimed at the real store while it is being
      # written: task test:store -- -run TestSomething -v
      - POSTGRES_TEST=1 POSTGRES_PORT={{.PORT}} go test ./internal/store/... -count=1 {{.CLI_ARGS}}

  cover:
    desc: Run the tests and open an HTML coverage report
    cmds:
      - go test ./... -coverprofile=coverage.out -covermode=atomic
      - go tool cover -func=coverage.out # render coverage report as text
      - go tool cover -html=coverage.out # render coverage report as HTML

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./...

  fmt:
    desc: Apply the formatters configured in .golangci.yml
    cmds:
      - golangci-lint fmt ./...

  tidy:
    desc: Tidy and verify go.mod
    cmds:
      - go mod tidy
      - go mod verify
      # The ent generator is a separate module and would otherwise drift unnoticed.
      - go mod tidy -C tools/entgen

  ent:generate:
    desc: Regenerate the ent client from internal/store/ent/schema
    aliases: [ent]
    # Two steps on purpose. The generator lives in tools/entgen, a module of its own,
    # so its dependencies stay out of the API's graph — and so that `go mod tidy` in
    # the main module cannot downgrade one of them to a version that does not compile,
    # which is what happened when the generator was a dependency here.
    #
    # Built first, then run from the repository root: entc loads ./schema with
    # go/packages, which has to resolve it inside the module that owns it.
    cmds:
      - go build -C tools/entgen -o "$(pwd)/bin/entgen" entgo.io/ent/cmd/ent
      - ./bin/entgen generate --feature intercept,sql/lock,sql/upsert,sql/modifier,sql/versioned-migration ./internal/store/ent/schema

  ent:check:
    desc: Fail if the committed ent client is out of date
    cmds:
      - task: ent:generate
      # Same reasoning as openapi:check: the generated code is committed, so a schema
      # change that nobody regenerated shows up as a diff in the pull request instead
      # of as a compile error on somebody else's branch.
      - git diff --exit-code -- internal/store/ent

  openapi:
    desc: Regenerate the committed OpenAPI document from the code
    cmds:
      - go run ./cmd/openapi > {{.SPEC}}

  openapi:check:
    desc: Fail if the committed OpenAPI document is out of date
    cmds:
      - task: openapi
      # The contract is code-first but reviewable: any change to a handler shows
      # up as a diff in the pull request instead of being invisible.
      - git diff --exit-code -- {{.SPEC}}

  bootstrap:
    desc: Grant the first owner (needs an account to already exist)
    cmds:
      - go run ./cmd/bootstrap {{.CLI_ARGS}}

  seed:
    desc: Fill a development database with the documented seed data
    # -yes is passed here because typing `task seed` is already the confirmation;
    # the flag exists so that running the binary directly does nothing by accident.
    # Extra arguments go through: `task seed -- -reset`, `task seed -- -only=cast`.
    cmds:
      - go run ./cmd/seed -yes {{.CLI_ARGS}}

  seed:reset:
    desc: Remove the seed data and seed it again
    cmds:
      - go run ./cmd/seed -yes -reset {{.CLI_ARGS}}

  migrate:
    desc: Apply pending migrations
    cmds:
      - atlas migrate apply --dir "file://migrations" --url "{{.DB_URL}}"

  migrate:diff:
    desc: Generate a migration from changes to the ent schema (NAME=... required)
    requires:
      vars: [NAME]
    vars:
      PORT: '{{.PORT | default "55442"}}'
      NAME_DB: mtgs-atlas-dev
    # ent computes the difference: it replays migrations/ onto a throwaway database to
    # learn the current state, compares that with the schema, and Atlas renders the SQL.
    # Replaying rather than reading a live database is what keeps the result independent
    # of which machine generated it.
    cmds:
      - task: ent:generate
      - defer: docker rm -f {{.NAME_DB}} >/dev/null 2>&1 || true
      - docker rm -f {{.NAME_DB}} >/dev/null 2>&1 || true
      - docker run -d --name {{.NAME_DB}} -e POSTGRES_PASSWORD=postgres -e POSTGRES_USER=postgres
        -e POSTGRES_DB=dev -p 127.0.0.1:{{.PORT}}:5432 postgres:18 >/dev/null
      - until docker exec {{.NAME_DB}} pg_isready -U postgres -d dev >/dev/null 2>&1; do sleep 1; done
      - sleep 1
      - until docker exec {{.NAME_DB}} pg_isready -U postgres -d dev >/dev/null 2>&1; do sleep 1; done
      - ATLAS_DEV_URL="postgres://postgres:postgres@localhost:{{.PORT}}/dev?sslmode=disable&search_path=public"
        go run ./cmd/entmigrate {{.NAME}}
      - atlas migrate hash --dir "file://migrations"

  # Migration to ent (see ENT.md). The dump is the "before" picture: the ent schema
  # is correct when the database it produces is byte-identical to this file, which is
  # a stronger statement than an empty Atlas diff — the diff can be empty because two
  # things are equally wrong.
  schema:dump:
    desc: Dump the schema of a freshly migrated throwaway database
    vars:
      PORT: '{{.PORT | default "55440"}}'
      NAME: mtgs-schema-dump
      OUT: '{{.OUT | default "schema.baseline.sql"}}'
    cmds:
      - defer: docker rm -f {{.NAME}} >/dev/null 2>&1 || true
      - docker rm -f {{.NAME}} >/dev/null 2>&1 || true
      - docker run -d --name {{.NAME}} -e POSTGRES_PASSWORD=postgres -e POSTGRES_USER=postgres
        -e POSTGRES_DB=postgres -p 127.0.0.1:{{.PORT}}:5432 postgres:18 >/dev/null
      - until docker exec {{.NAME}} pg_isready -U postgres -d postgres >/dev/null 2>&1; do sleep 1; done
      - sleep 1
      - until docker exec {{.NAME}} pg_isready -U postgres -d postgres >/dev/null 2>&1; do sleep 1; done
      - atlas migrate apply --dir "file://migrations"
        --url "postgres://postgres:postgres@localhost:{{.PORT}}/postgres?sslmode=disable"
      # Excluding Atlas's bookkeeping: it records which migrations ran, not what the
      # schema is. By *schema* rather than by table — Atlas puts that table in a schema
      # of its own, so --exclude-table never matched it and the first comparison spent
      # eighteen lines of diff on it.
      #
      # The grep is what makes two dumps comparable at all: pg_dump 18 opens with a
      # \restrict line carrying a random token, and prints the server version it ran
      # against. Both change between runs, so a byte comparison would always differ
      # and the file would be worthless for the one job it has.
      - docker exec {{.NAME}} pg_dump -U postgres -d postgres --schema-only --no-owner
        --exclude-schema=atlas_schema_revisions
        | grep -v -E '^\\(un)?restrict |^-- Dumped (from|by)' > {{.OUT}}
      - 'echo "wrote {{.OUT}}"'

  # The acceptance test for the ent schema: apply it to an empty database, dump it, and
  # diff the dump against the one migrations/ produces. Stronger than comparing two
  # descriptions, because it compares two databases.
  schema:dump:ent:
    desc: Dump the schema the ent definition produces
    vars:
      PORT: '{{.PORT | default "55441"}}'
      NAME: mtgs-schema-ent
      OUT: '{{.OUT | default "schema.ent.sql"}}'
    cmds:
      # Generated first, and this is not a convenience. Dumping from a stale client is
      # how this task once reported "schemas match" after the generator had failed:
      # the verdict described code from the previous run. A comparison that can pass on
      # yesterday's output is worse than no comparison.
      - task: ent:generate
      - defer: docker rm -f {{.NAME}} >/dev/null 2>&1 || true
      - docker rm -f {{.NAME}} >/dev/null 2>&1 || true
      - docker run -d --name {{.NAME}} -e POSTGRES_PASSWORD=postgres -e POSTGRES_USER=postgres
        -e POSTGRES_DB=postgres -p 127.0.0.1:{{.PORT}}:5432 postgres:18 >/dev/null
      - until docker exec {{.NAME}} pg_isready -U postgres -d postgres >/dev/null 2>&1; do sleep 1; done
      - sleep 1
      - until docker exec {{.NAME}} pg_isready -U postgres -d postgres >/dev/null 2>&1; do sleep 1; done
      - DATABASE_URL="postgres://postgres:postgres@localhost:{{.PORT}}/postgres?sslmode=disable"
        go run ./cmd/entmigrate -apply
      - docker exec {{.NAME}} pg_dump -U postgres -d postgres --schema-only --no-owner
        | grep -v -E '^\\(un)?restrict |^-- Dumped (from|by)' > {{.OUT}}
      - 'echo "wrote {{.OUT}}"'

  # Still worth having after the migration off GORM: it catches a migration edited by
  # hand, or a schema change somebody generated against the wrong branch. It is the
  # schema's openapi:check, except that it needs Docker and so is not in `task check`.
  schema:compare:
    desc: Diff the ent schema against the one the migrations produce
    # Normalised before comparing, because two of the three ways these dumps differ
    # carry no meaning:
    #
    #   - column order. pg_dump prints columns in ordinal position, and ent puts the
    #     mixin's columns first. Nothing reads a column by position.
    #   - constraint names. ent names foreign keys its own way and offers no hook to
    #     override them; the columns and the ON DELETE action are what matter, and
    #     those are compared.
    #
    # Anything left is a real difference: a column, a type, a default, an index.
    # The unnormalised dumps stay on disk for whoever wants to read them.
    cmds:
      - task: schema:dump
      - task: schema:dump:ent
      - ./scripts/schema-compare.sh schema.baseline.sql schema.ent.sql

  migrate:status:
    desc: Show which migrations have been applied
    cmds:
      - atlas migrate status --dir "file://migrations" --url "{{.DB_URL}}"

  # Compose. The root compose.yml is an include pointer, so these run from the
  # repository root like every other task. Extra arguments after -- go to
  # Compose: `task up -- postgres` starts only the database. With no arguments
  # this waits on `api`, not the whole project — otherwise `--wait` treats the
  # one-shot migrate container as a daemon that never became healthy.
  compose:up:
    desc: Start the development stack (Postgres, migrations, API)
    aliases: [up]
    cmds:
      - docker compose up -d --wait {{if .CLI_ARGS}}{{.CLI_ARGS}}{{else}}api{{end}}

  compose:down:
    desc: Stop the stack (data and caches stay)
    aliases: [down]
    cmds:
      - docker compose down {{.CLI_ARGS}}

  compose:reset:
    desc: Stop the stack and delete data and caches
    prompt: This deletes Postgres data and Go build caches. Continue?
    cmds:
      - docker compose down -v

  compose:stop:
    desc: Stop containers without removing them
    cmds:
      - docker compose stop {{.CLI_ARGS}}

  compose:ps:
    desc: Show compose container status
    cmds:
      - docker compose ps {{.CLI_ARGS}}

  compose:logs:
    desc: Follow compose logs (service name after --)
    interactive: true
    cmds:
      - docker compose logs -f {{.CLI_ARGS}}

  compose:migrate:
    desc: Apply pending migrations in a one-shot Atlas container
    cmds:
      - docker compose run --rm migrate

  compose:build:
    desc: Build compose images
    cmds:
      - docker compose build {{.CLI_ARGS}}

  compose:otel:
    desc: Start the observability stack (Grafana on :3000, OTLP on :4318)
    aliases: [otel]
    # The API is already configured to export to it; this only starts the receiver.
    # Restarting the api service is not needed — the exporter retries.
    cmds:
      - docker compose --profile otel up -d --wait otel
      - 'echo "Grafana: http://127.0.0.1:3000 (traces: Tempo, metrics: Prometheus, logs: Loki)"'

  compose:debug:
    desc: Start the API under delve (API 4001, debugger 2345)
    cmds:
      - docker compose --profile debug up -d --wait api-debug

  compose:shell:
    desc: Open a shell in the API container
    interactive: true
    cmds:
      - docker compose exec api sh

  compose:bootstrap:
    desc: Grant the first owner inside the API container
    cmds:
      - docker compose exec api go run ./cmd/bootstrap {{.CLI_ARGS}}

  check:
    desc: Everything CI should run
    cmds:
      - task: tidy
      - task: lint
      - task: test
      - task: ent:check
      - task: openapi:check

  clean:
    desc: Remove build and coverage artefacts
    cmds:
      - rm -rf bin coverage.out coverage.html schema.baseline.sql schema.ent.sql

  web:install:
    desc: Install the web client dependencies
    cmds:
      - cd clients/web && npm install

  web:api:
    desc: Regenerate the committed Angular client from the OpenAPI document
    # Run this whenever a handler's contract changes. The generated client is
    # committed, and it had already drifted several commits behind the spec before
    # anybody looked — the generator's own output is unformatted, so the format step
    # is part of the task rather than something to remember afterwards.
    cmds:
      - task: openapi
      - cd clients/web && npm run api:generate
      - task: web:format

  web:serve:
    desc: Serve the Swagger UI for the OpenAPI document
    cmds:
      - cd clients/web && npm run start

  web:build:
    desc: Build the Swagger UI for the OpenAPI document
    cmds:
      - cd clients/web && npm run build

  web:format:
    desc: Format the web client code
    cmds:
      - cd clients/web && npm run format