name: CI

on:
  push:
    branches: [ main ]
  pull_request:

# A second push to the same branch cancels the first: the older run's verdict is
# about to be irrelevant anyway.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOLANGCI_LINT_VERSION: v2.12.2

jobs:
  check:
    runs-on: ubuntu-latest

    # The repository tests need a real database. They cover the SQL the
    # in-memory fake reimplements in Go — the conditional UPDATEs, the ::inet
    # cast, SELECT ... FOR UPDATE, NULLS LAST, the filtered count that refuses
    # another tenant's role id — none of which any other test can see. Left out
    # of CI they run only when somebody remembers to, which is to say they rot.
    #
    # 18-alpine matches .docker/compose.yml. A version skew between CI and the
    # local stack is how "works locally" starts.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        # -U matters: pg_isready otherwise probes as the container's default OS
        # user and reports a healthy server as unreachable, so the job would
        # start against a database that is not ready.
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          # Read from go.mod rather than pinned here, so the toolchain version
          # lives in one place.
          go-version-file: go.mod
          cache: true

      - name: Modules are tidy
        run: |
          go mod tidy
          go mod tidy -C tools/entgen
          git diff --exit-code -- go.mod go.sum tools/entgen/go.mod tools/entgen/go.sum

      - name: Lint
        # Installed rather than taken from golangci-lint-action, whose major
        # versions are tied to the linter's: the v2 config in .golangci.yml
        # needs the /v2/ module path, and the old path silently installs v1.
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }}
          golangci-lint run ./...

      - uses: ariga/setup-atlas@v0

      # Before the tests, not after: the repository tests query real tables, and
      # a database with no schema fails them in a way that points at the query
      # rather than at the missing migration.
      #
      # The URL is spelled out rather than taken from Taskfile.yml because Task
      # builds it from .env, which does not exist here. It has to stay in step
      # with the defaults in internal/config that testDB also relies on.
      - name: Apply migrations
        run: atlas migrate apply --dir "file://migrations" --url "$DB_URL"
        env:
          DB_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable

      # This also runs the architecture tests, which are where the "huma stays
      # inside internal/api" rule is actually enforced.
      #
      # POSTGRES_TEST is what un-skips the repository tests; the rest of their
      # configuration comes from the defaults in internal/config, which already
      # match the service above. -race covers them too, which matters for the
      # concurrency tests around the attempt counters.
      - name: Test
        run: go test ./... -race
        env:
          POSTGRES_TEST: "1"

      - name: Generated ent client is current
        run: |
          go build -C tools/entgen -o bin/entgen entgo.io/ent/cmd/ent
          ./bin/entgen generate --feature intercept,sql/lock,sql/upsert,sql/modifier,sql/versioned-migration ./internal/store/ent/schema
          git diff --exit-code -- internal/store/ent \
            || { echo "::error::The ent client is stale. Run 'task ent:generate' and commit the result."; exit 1; }

      - name: OpenAPI document is current
        run: |
          go run ./tools/openapi > api/openapi.yaml
          git diff --exit-code -- api/openapi.yaml \
            || { echo "::error::The API contract changed. Run 'task openapi' and commit api/openapi.yaml."; exit 1; }

      - name: Migration directory is intact
        run: atlas migrate validate --dir "file://migrations"
